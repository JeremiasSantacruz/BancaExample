<dialog
  #dialog
  (cancel)="dismissed.emit()"
  aria-describedby="operation-result-message"
  aria-labelledby="operation-result-title"
  class="result-dialog"
>
  <div [class.result-error]="result.kind === 'error'" aria-hidden="true" class="result-icon">
    {{ result.kind === 'success' ? '✓' : '!' }}
  </div>
  <h2 id="operation-result-title">
    {{ result.kind === 'success' ? 'Registro guardado' : 'No se pudo guardar' }}
  </h2>
  <p id="operation-result-message">{{ result.message }}</p>
  <button (click)="dismissed.emit()" autofocus class="button button-primary" type="button">
    {{ result.kind === 'success' ? 'Aceptar' : 'Volver al formulario' }}
  </button>
</dialog>
