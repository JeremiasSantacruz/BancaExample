# nginx sirve la SPA compilada y hace de proxy inverso hacia el backend, de modo
# que el navegador siempre habla con un unico origen (mismo esquema, host y
# puerto) y no hay CORS entre la UI y el API.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: obligatorio para resolver el nombre del backend en
    # cada peticion (ver el bloque /api de abajo).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Angular genera los archivos con hash en el nombre, asi que se cachean
    # para siempre. index.html queda fuera del cache para que un despliegue
    # nuevo se vea al recargar.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Mismo contrato que el proxy de desarrollo: se quita el prefijo /api antes
    # de reenviar la peticion al backend.
    location /api/ {
        # `set` va antes que `rewrite`: `rewrite ... break` detiene el modulo de
        # reescritura, asi que cualquier `set` posterior quedaria sin ejecutar.
        #
        # Resolver en cada peticion (y no al cargar la configuracion) para que
        # nginx no quede con la IP vieja si el contenedor del backend se recrea.
        set $backend_upstream backend:8080;

        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://$backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Rutas de la SPA (/clientes, /cuentas, /movimientos, /reportes): cualquier
    # ruta desconocida devuelve index.html para que el router de Angular resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}