<div class="form-field" [class.has-error]="error()">
  <label [attr.for]="controlId()">
    {{ label() }}
    @if (required()) {
      <span class="required-mark" aria-hidden="true">*</span>
    }
  </label>

  <ng-content />

  @if (hint()) {
    <small class="field-hint">{{ hint() }}</small>
  }

  @if (error()) {
    <small class="field-error">{{ error() }}</small>
  }
</div>
