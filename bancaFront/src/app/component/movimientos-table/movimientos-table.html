<div class="table-scroll">
  <table>
    <thead>
      <tr>
        <th>FECHA Y HORA</th>
        <th>CUENTA</th>
        <th>TIPO</th>
        <th>VALOR</th>
        <th>ESTADO</th>
        <th class="actions-heading">ACCIONES</th>
      </tr>
    </thead>
    <tbody>
      @for (movimiento of movimientos(); track movimiento.movimientoId) {
        <tr
          (reverse)="reverse.emit($event)"
          [busy]="busy()"
          [canReverse]="canReverse()"
          [movimiento]="movimiento"
          app-movimiento-row
        ></tr>
      } @empty {
        <tr>
          <td class="empty-state" colspan="6">{{ emptyMessage() }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
